<html>
  <head>
    <title>starbin</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="solarized_dark.css" />
    <link rel="stylesheet" type="text/css" href="application.css" />

    <script type="text/javascript" src="jquery-1.7.1.min.js"></script>
    <script type="text/javascript" src="highlight.min.js"></script>
    <script type="text/javascript" src="application.min.js"></script>

    <meta name="robots" content="noindex,nofollow" />

    <script type="text/javascript">
      var app = null;
      // Handle pops
      var handlePop = function (evt) {
        var path = evt.target.location.pathname;
        if (path === "/") {
          app.newDocument(true);
        } else {
          app.loadDocument(path.substring(1, path.length));
        }
      };
      // Set up the pop state to handle loads, skipping the first load
      // to make chrome behave like others:
      // http://code.google.com/p/chromium/issues/detail?id=63040
      setTimeout(function () {
        window.onpopstate = function (evt) {
          try {
            handlePop(evt);
          } catch (err) {
            /* not loaded yet */
          }
        };
      }, 1000);
      // Construct app and load initial path
      $(function () {
        app = new haste("starbin", { twitter: false });
        handlePop({ target: window });
      });
    </script>
  </head>

  <body>
    <ul id="messages"></ul>

    <div id="key">
      <div id="pointer" style="display: none"></div>
      <div id="box1">
        <a href="/about.md" class="logo"></a>
      </div>
      <div id="box2">
        <button class="save function button-picture">Save</button>
        <button class="new function button-picture">New</button>
        <button class="duplicate function button-picture">Duplicate & Edit</button>
        <button class="raw function button-picture">Just Text</button>
        <button class="twitter function button-picture">Twitter</button>
      </div>
      <div id="box3" style="display: none">
        <div class="label"></div>
        <div class="shortcut"></div>
      </div>
    </div>

    <div id="linenos"></div>
    <pre id="box" style="display: none" class="hljs" tabindex="0"><code></code></pre>
    <textarea spellcheck="false" style="display: none"></textarea>

    <!-- Custom Save Dialog -->
    <div id="save-dialog" class="modal" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h3>自定义保存</h3>
          <span class="close">&times;</span>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="custom-id">自定义文档ID (可选):</label>
            <input type="text" id="custom-id" placeholder="留空将自动生成ID" maxlength="50">
            <div class="validation-message" id="id-validation"></div>
          </div>
          <div class="help-text">
            <h4>ID规则说明:</h4>
            <ul>
              <li>只能包含字母 (a-z, A-Z)、数字 (0-9) 和连字符 (-)</li>
              <li>长度限制: 1-50 个字符</li>
              <li>不能以连字符开头或结尾</li>
              <li>文档后缀会根据检测到的语言自动添加 (如 .js, .py, .md)</li>
              <li>如果留空，系统将自动生成安全的随机ID</li>
            </ul>
            <div class="examples">
              <strong>有效示例:</strong> my-document, user123, MyFile<br>
              <strong>无效示例:</strong> -invalid, file!, my@doc
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-confirm" class="btn btn-primary">保存</button>
          <button id="save-cancel" class="btn btn-secondary">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
